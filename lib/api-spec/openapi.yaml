openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Vitals Overwatch API - Family Health Intelligence Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: family
    description: Family member management
  - name: vitals
    description: Biometric vitals data
  - name: alerts
    description: Anomaly alerts and events
  - name: reports
    description: Baseline report generation
  - name: profile
    description: User profile and settings
  - name: providers
    description: External data provider connections
  - name: forecast
    description: Biometric Time-Travel predictive forecast

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"

  /family/members:
    get:
      operationId: listFamilyMembers
      tags: [family]
      summary: List all family members
      responses:
        "200":
          description: List of family members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyMember"
    post:
      operationId: createFamilyMember
      tags: [family]
      summary: Add a family member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyMemberRequest"
      responses:
        "201":
          description: Family member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"

  /family/members/{memberId}:
    get:
      operationId: getFamilyMember
      tags: [family]
      summary: Get a specific family member
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Family member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "404":
          description: Not found

  /family/members/{memberId}/vitals:
    get:
      operationId: getMemberVitals
      tags: [vitals]
      summary: Get vitals for a family member
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: Vitals data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VitalsReading"
    post:
      operationId: recordVitals
      tags: [vitals]
      summary: Record new vitals reading
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVitalsRequest"
      responses:
        "201":
          description: Vitals recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VitalsReading"

  /family/members/{memberId}/baseline:
    get:
      operationId: getMemberBaseline
      tags: [vitals]
      summary: Get the AI-computed baseline for a family member
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Computed biometric baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricBaseline"

  /family/members/{memberId}/summary:
    get:
      operationId: getMemberHealthSummary
      tags: [vitals]
      summary: Get the latest health summary for a family member
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List all active alerts across the family
      parameters:
        - name: memberId
          in: query
          required: false
          schema:
            type: integer
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthAlert"

  /alerts/{alertId}/resolve:
    post:
      operationId: resolveAlert
      tags: [alerts]
      summary: Mark an alert as resolved
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAlert"

  /reports/{memberId}:
    get:
      operationId: generateBaselineReport
      tags: [reports]
      summary: Generate a clinical baseline report for a family member
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Clinical baseline report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineReport"

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [family]
      summary: Get a high-level overview of all family members' health status
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"

  /profile:
    get:
      operationId: getUserProfile
      tags: [profile]
      summary: Get the current user's profile and stats
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUserProfile
      tags: [profile]
      summary: Update user profile settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /profile/stats:
    get:
      operationId: getProfileStats
      tags: [profile]
      summary: Get usage and health stats for the user's profile
      responses:
        "200":
          description: Profile statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileStats"

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List all available data providers and their connection status
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataProvider"

  /providers/{provider}/connect:
    post:
      operationId: connectProvider
      tags: [providers]
      summary: Initiate connection to a data provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectProviderRequest"
      responses:
        "200":
          description: Connection initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProvider"

  /providers/{provider}/disconnect:
    post:
      operationId: disconnectProvider
      tags: [providers]
      summary: Disconnect a data provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProvider"

  /providers/{provider}/sync:
    post:
      operationId: syncProvider
      tags: [providers]
      summary: Trigger a manual data sync for a connected provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncProviderRequest"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /forecast/{memberId}:
    get:
      operationId: getBiometricForecast
      tags: [forecast]
      summary: Get the Biometric Time-Travel predictive health forecast for a member
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
        - name: horizonHours
          in: query
          required: false
          schema:
            type: integer
            default: 72
      responses:
        "200":
          description: Biometric forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricForecast"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GetCurrentAuthUserResponse:
      type: object
      properties:
        isAuthenticated:
          type: boolean
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            email:
              type: string
              nullable: true
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            profileImageUrl:
              type: string
              nullable: true
          required:
            - id
      required:
        - isAuthenticated

    ExchangeMobileAuthorizationCodeBody:
      type: object
      properties:
        code:
          type: string
        state:
          type: string
        codeVerifier:
          type: string
        nonce:
          type: string
      required:
        - code
        - state
        - codeVerifier
        - nonce

    FamilyMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        relationship:
          type: string
        avatarInitials:
          type: string
        wearableSource:
          type: string
          enum: [apple_watch, oura, whoop, garmin, fitbit, manual]
        isHighRisk:
          type: boolean
        guardianViewEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - age
        - relationship
        - avatarInitials
        - wearableSource
        - isHighRisk
        - guardianViewEnabled
        - createdAt

    CreateFamilyMemberRequest:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        relationship:
          type: string
        wearableSource:
          type: string
          enum: [apple_watch, oura, whoop, garmin, fitbit, manual]
        isHighRisk:
          type: boolean
        guardianViewEnabled:
          type: boolean
      required:
        - name
        - age
        - relationship
        - wearableSource
        - isHighRisk
        - guardianViewEnabled

    VitalsReading:
      type: object
      properties:
        id:
          type: integer
        memberId:
          type: integer
        timestamp:
          type: string
          format: date-time
        heartRateVariability:
          type: number
        restingHeartRate:
          type: number
        spo2:
          type: number
        sleepScore:
          type: number
          nullable: true
        recoveryScore:
          type: number
          nullable: true
        bodyTemperature:
          type: number
          nullable: true
        respiratoryRate:
          type: number
          nullable: true
        anomalyScore:
          type: number
          nullable: true
        anomalyFlags:
          type: array
          items:
            type: string
      required:
        - id
        - memberId
        - timestamp
        - heartRateVariability
        - restingHeartRate
        - spo2
        - anomalyFlags

    CreateVitalsRequest:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        heartRateVariability:
          type: number
        restingHeartRate:
          type: number
        spo2:
          type: number
        sleepScore:
          type: number
          nullable: true
        recoveryScore:
          type: number
          nullable: true
        bodyTemperature:
          type: number
          nullable: true
        respiratoryRate:
          type: number
          nullable: true
      required:
        - heartRateVariability
        - restingHeartRate
        - spo2

    BiometricBaseline:
      type: object
      properties:
        memberId:
          type: integer
        computedAt:
          type: string
          format: date-time
        avgHrv:
          type: number
        stdHrv:
          type: number
        avgRestingHr:
          type: number
        stdRestingHr:
          type: number
        avgSpo2:
          type: number
        stdSpo2:
          type: number
        avgSleepScore:
          type: number
          nullable: true
        dataPointCount:
          type: integer
        baselineDays:
          type: integer
      required:
        - memberId
        - computedAt
        - avgHrv
        - stdHrv
        - avgRestingHr
        - stdRestingHr
        - avgSpo2
        - stdSpo2
        - dataPointCount
        - baselineDays

    HealthSummary:
      type: object
      properties:
        memberId:
          type: integer
        latestReading:
          $ref: "#/components/schemas/VitalsReading"
        baseline:
          $ref: "#/components/schemas/BiometricBaseline"
        status:
          type: string
          enum: [excellent, good, fair, warning, critical]
        trendHrv:
          type: string
          enum: [improving, stable, declining]
        trendHr:
          type: string
          enum: [improving, stable, declining]
        activeAlerts:
          type: integer
      required:
        - memberId
        - status
        - activeAlerts
        - trendHrv
        - trendHr

    HealthAlert:
      type: object
      properties:
        id:
          type: integer
        memberId:
          type: integer
        memberName:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        alertType:
          type: string
        title:
          type: string
        description:
          type: string
        deviationPercent:
          type: number
        detectedAt:
          type: string
          format: date-time
        resolved:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - memberId
        - memberName
        - severity
        - alertType
        - title
        - description
        - deviationPercent
        - detectedAt
        - resolved

    BaselineReport:
      type: object
      properties:
        memberId:
          type: integer
        memberName:
          type: string
        memberAge:
          type: integer
        reportGeneratedAt:
          type: string
          format: date-time
        reportPeriodDays:
          type: integer
        wearableSource:
          type: string
        baseline:
          $ref: "#/components/schemas/BiometricBaseline"
        recentTrends:
          type: object
          properties:
            hrvTrend:
              type: string
            hrTrend:
              type: string
            spo2Trend:
              type: string
            overallAssessment:
              type: string
          required:
            - hrvTrend
            - hrTrend
            - spo2Trend
            - overallAssessment
        activeAlerts:
          type: array
          items:
            $ref: "#/components/schemas/HealthAlert"
        vitalsHistory:
          type: array
          items:
            $ref: "#/components/schemas/VitalsReading"
        clinicalNotes:
          type: string
      required:
        - memberId
        - memberName
        - memberAge
        - reportGeneratedAt
        - reportPeriodDays
        - wearableSource
        - recentTrends
        - activeAlerts
        - vitalsHistory
        - clinicalNotes

    MemberHealthCard:
      type: object
      properties:
        member:
          $ref: "#/components/schemas/FamilyMember"
        summary:
          $ref: "#/components/schemas/HealthSummary"
        latestReading:
          $ref: "#/components/schemas/VitalsReading"
          nullable: true
        activeAlertCount:
          type: integer
      required:
        - member
        - summary
        - activeAlertCount

    DashboardOverview:
      type: object
      properties:
        totalMembers:
          type: integer
        membersWithAlerts:
          type: integer
        criticalAlerts:
          type: integer
        familyCards:
          type: array
          items:
            $ref: "#/components/schemas/MemberHealthCard"
        recentAlerts:
          type: array
          items:
            $ref: "#/components/schemas/HealthAlert"
      required:
        - totalMembers
        - membersWithAlerts
        - criticalAlerts
        - familyCards
        - recentAlerts

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        defaultFamilyMemberId:
          type: integer
          nullable: true
        timezone:
          type: string
        notificationsEnabled:
          type: boolean
        guardianAlertEmail:
          type: string
          nullable: true
        onboardingComplete:
          type: boolean
      required:
        - userId
        - timezone
        - notificationsEnabled
        - onboardingComplete

    UpdateUserProfileRequest:
      type: object
      properties:
        defaultFamilyMemberId:
          type: integer
          nullable: true
        timezone:
          type: string
        notificationsEnabled:
          type: boolean
        guardianAlertEmail:
          type: string
          nullable: true

    ProfileStats:
      type: object
      properties:
        totalReadings:
          type: integer
        daysTracked:
          type: integer
        alertsGenerated:
          type: integer
        alertsResolved:
          type: integer
        familyMemberCount:
          type: integer
        connectedProviders:
          type: integer
        currentStreak:
          type: integer
          description: Consecutive days with at least one vitals reading
        avgDailyReadings:
          type: number
        memberProgress:
          type: array
          items:
            $ref: "#/components/schemas/MemberProgress"
      required:
        - totalReadings
        - daysTracked
        - alertsGenerated
        - alertsResolved
        - familyMemberCount
        - connectedProviders
        - currentStreak
        - avgDailyReadings
        - memberProgress

    MemberProgress:
      type: object
      properties:
        memberId:
          type: integer
        memberName:
          type: string
        avatarInitials:
          type: string
        readingCount:
          type: integer
        lastReadingAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        hrvTrend:
          type: string
        alertCount:
          type: integer
      required:
        - memberId
        - memberName
        - avatarInitials
        - readingCount
        - status
        - hrvTrend
        - alertCount

    DataProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
          enum: [smartwatch, ring, strap, manual, platform]
        connected:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        syncedReadings:
          type: integer
        features:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [connected, disconnected, syncing, error]
      required:
        - id
        - name
        - description
        - icon
        - category
        - connected
        - features
        - status
        - syncedReadings

    ConnectProviderRequest:
      type: object
      properties:
        memberId:
          type: integer
          description: Which family member to link this provider to
        authCode:
          type: string
          nullable: true
      required:
        - memberId

    SyncProviderRequest:
      type: object
      properties:
        memberId:
          type: integer
      required:
        - memberId

    SyncResult:
      type: object
      properties:
        provider:
          type: string
        readingsImported:
          type: integer
        lastSyncAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        - provider
        - readingsImported
        - lastSyncAt
        - message

    ForecastPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        hrv:
          type: number
        hrvLower:
          type: number
        hrvUpper:
          type: number
        restingHr:
          type: number
        hrLower:
          type: number
        hrUpper:
          type: number
        spo2:
          type: number
        spo2Lower:
          type: number
        spo2Upper:
          type: number
        anomalyProbability:
          type: number
        isHistory:
          type: boolean
      required:
        - timestamp
        - hrv
        - hrvLower
        - hrvUpper
        - restingHr
        - hrLower
        - hrUpper
        - spo2
        - spo2Lower
        - spo2Upper
        - anomalyProbability
        - isHistory

    HealthEvent:
      type: object
      properties:
        type:
          type: string
          enum: [fever, respiratory_stress, cardiac_stress, burnout, infection, recovery]
        label:
          type: string
        probability:
          type: number
        expectedOnset:
          type: string
          format: date-time
        confidence:
          type: string
          enum: [low, moderate, high]
        description:
          type: string
        warningSignals:
          type: array
          items:
            type: string
      required:
        - type
        - label
        - probability
        - expectedOnset
        - confidence
        - description
        - warningSignals

    BiometricForecast:
      type: object
      properties:
        memberId:
          type: integer
        memberName:
          type: string
        generatedAt:
          type: string
          format: date-time
        horizonHours:
          type: integer
        dataQuality:
          type: string
          enum: [insufficient, low, moderate, high]
        overallRisk:
          type: string
          enum: [low, moderate, elevated, high]
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
        predictedEvents:
          type: array
          items:
            $ref: "#/components/schemas/HealthEvent"
        trendSummary:
          type: string
        methodology:
          type: string
      required:
        - memberId
        - memberName
        - generatedAt
        - horizonHours
        - dataQuality
        - overallRisk
        - timeline
        - predictedEvents
        - trendSummary
        - methodology
